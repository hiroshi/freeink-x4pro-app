; FreeInk SDK — elapsed-time + battery status screen for the Xteink X4 Pro,
; plus a button-triggered "fetch text from a URL and page through it" reader.
;
; Adapted from freeink-sdk/platformio.sample.ini ([base] + [env:x4pro]). Libraries:
; display + UI text rendering, Rtc (BM8563 wall clock), BatteryMonitor (CW2017
; fuel gauge), InputManager (Left/Right/Power buttons), and SecureNet (plain
; HTTP GET over WiFiClient — no wolfSSL, so https:// is NOT supported; add
; -DFREEINK_NET_WOLFSSL=1 + a wolfSSL lib_dep for that). Deep-sleep power mgmt
; is done inline via esp_light_sleep_start().

[env:x4pro]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board = esp32-s3-devkitc1-n16r8  ; 16 MB flash + 8 MB PSRAM (matches the X4 Pro dump)
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the controller's RAM holds the previous frame.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  ; Reader feature secrets — pulled from real shell env vars, or from a
  ; gitignored .env file loaded by the Makefile (see .env.example). Never
  ; commit real values here: this repo is public. Empty when unset; main.cpp
  ; then shows a "not configured" screen instead of connecting to "".
  -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
  -DFETCH_URL=\"${sysenv.FETCH_URL}\"

build_unflags =
  -std=gnu++11

; FreeInk libraries. Point at the freeink-sdk checkout cloned alongside this
; project (adjust the path if you vendor the SDK elsewhere).
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
